<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Scan to connect with Thomas Richardson — Richardson Partners, LLC">
  <meta name="theme-color" content="#000066">
  <title>Scan QR | Thomas Richardson</title>
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="qr.css">
</head>
<body>
  <main class="qr-page">

      <img src="../../assets/logo.png" alt="Richardson Partners, LLC" class="qr-logo">
      <h1>Thomas Richardson</h1>
      <p>Richardson Partners, LLC</p>
    </header>

    <div class="qr-card">
      <img src="qr-code.png" alt="QR code — scan to save contact" class="qr-image">
      <p class="qr-caption">Scan to connect</p>
    </div>

    <a href="../" class="qr-link">View contact card</a>
  </main>
</body>
</html>
